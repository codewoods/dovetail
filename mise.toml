# https://mise.jdx.dev/
# mise ls-remote bun
# mise ls; mise uninstall bun@1.3.13
# 暫時不考慮 bun 1.3.15 以後版本，可能需要遷回 pnpm
[tools]
python = "3.12.12"
node = "24.14.1"
bun = "1.3.13"
go = "1.26.0"
sops = "3.13.1"

[settings]
python.uv_venv_auto = true
sops.rops = false

[env]
_.python.venv = { path = ".venv", create = true }
